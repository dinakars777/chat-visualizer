<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ChatVisualizer sanitized app screenshot</title>
  <desc id="desc">A sanitized screenshot-style preview of ChatVisualizer with fake projects, fake counts, and fake transcript content.</desc>
  <defs>
    <style>
      .bg { fill: #edf5f4; }
      .surface { fill: #fbfdfd; }
      .panel { fill: #e6f0ef; }
      .line { stroke: #c9d8d6; stroke-width: 1; }
      .line-strong { stroke: #a8bbba; stroke-width: 1.2; }
      .ink { fill: #172321; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5d706d; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { fill: #5d706d; font-family: "SFMono-Regular", "Cascadia Code", Menlo, monospace; font-weight: 700; letter-spacing: 0; }
      .mono-dark { fill: #286f68; font-family: "SFMono-Regular", "Cascadia Code", Menlo, monospace; font-weight: 800; letter-spacing: 0; }
      .title { font-size: 34px; font-weight: 800; }
      .h2 { font-size: 24px; font-weight: 800; }
      .h3 { font-size: 17px; font-weight: 800; }
      .big { font-size: 30px; font-weight: 800; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .tiny { font-size: 10px; }
      .chip { fill: #ffffff; stroke: #c9d8d6; stroke-width: 1; }
      .chip-active { fill: #172321; }
      .active { fill: #dce9ff; }
      .accent { fill: #245eea; }
      .accent-soft { fill: #edf1ff; stroke: #b9c8ff; stroke-width: 1; }
      .warn-soft { fill: #fff0d2; stroke: #e6bd74; stroke-width: 1; }
    </style>
  </defs>

